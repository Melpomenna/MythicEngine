name: MythicEngine

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  configure:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.31.6'
      - name: Configure
        run: cmake --preset=x64-release

  build:
    runs-on: self-hosted
    needs: configure
    steps:
      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.31.6'

      - name: Build
        run: cmake --build . --preset=x64-release

  test:
    runs-on: self-hosted
    needs: build
    steps:
      - name: Run Tests
        env:
            MIMALLOC_VERBOSE: 1
        run: ctest --preset=x64-release
  benchmark:
    runs-on: self-hosted
    needs: build
    steps:
      - name: Run Benchmarks
        run: .\build\x64-release\WorkFolder\Benchmarks.exe
  archive:
    runs-on: self-hosted
    needs: [build, test, benchmark]
    steps:
      - name: Archive Release
        uses: actions/upload-artifact@v4
        with:
          name: MythinEngine-release
          path: build/x64-release/WorkFolder
          minimum-approvals: 1