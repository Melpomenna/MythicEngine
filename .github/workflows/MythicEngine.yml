name: MythicEngine

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.31.6'

      - name: Configure
        run: cmake --preset=x64-release

      - name: Build
        run: cmake --build . --preset=x64-release

      - name: Run Tests
        run: ctest --preset=x64-release

      - name: Run Benchmarks
        run: .\build\x64-release\WorkFolder\Benchmarks.exe

      - name: Archive Release
        uses: actions/upload-artifact@v4
        with:
          name: MythinEngine-release
          path: build/release/WorkFolder
