trigger:
  branches:
    include:
      - main
      - develop 

pool:
  name: default

steps:
- task: CMake@1
  displayName: "Configurate"
  inputs:
    workingDirectory: 
    cmakeArgs: '--preset=x64-release'
- task: CMake@1
  displayName: "Build"
  inputs: 
    workingDirectory: 
    cmakeArgs: "--build . --preset=x64-release"
- task: PowerShell@2
  displayName: "Tests"
  inputs:
    targetType: 'inline'
    script: |
        $env:PATH += ";$(Build.SourcesDirectory)\build\x64-release\WorkFolder"
        ctest --preset=x64-release
    workingDirectory: $(Build.SourcesDirectory)
- task: PowerShell@2
  displayName: "Install VC++ Redistributable"
  inputs:
    targetType: 'inline'
    script: |
      Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "vc_redist.x64.exe"
      Start-Process -FilePath "vc_redist.x64.exe" -ArgumentList "/quiet" -Wait
- task: PowerShell@2
  displayName: "Benchmarks"
  inputs:
    targetType: 'inline'
    script: |
        .\build\x64-release\WorkFolder\Benchmarks.exe
    workingDirectory: $(Build.SourcesDirectory)
- task: ArchiveFiles@2
  displayName: "Create archive"
  inputs:
    rootFolderOrFile: '$(Build.SourcesDirectory)/build/release/WorkFolder'
    includeRootFolder: false
    archiveFile: '$(Build.ArtifactStagingDirectory)/MythinEngine-release.zip'
    replaceExistingArchive: true

- task: PublishBuildArtifacts@1
  displayName: "Publish artifacts"
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'release'
    publishLocation: 'Container'