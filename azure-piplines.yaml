trigger:
  branches:
    include:
      - main
      - develop 

pool:
  name: default

steps:
- task: CMake@1
  displayName: "Configurate"
  inputs:
    workingDirectory: 
    cmakeArgs: '--preset=x64-release'
- task: CMake@1
  displayName: "Build"
  inputs: 
    workingDirectory: 
    cmakeArgs: "--build . --preset=x64-release"
- task: ArchiveFiles@2
  displayName: "Create archive"
  inputs:
    rootFolderOrFile: '$(Build.SourcesDirectory)/build/x64-release/WorkFolder'
    includeRootFolder: false
    archiveFile: '$(Build.ArtifactStagingDirectory)/MythinEngine-release.zip'
    replaceExistingArchive: true

- task: PublishBuildArtifacts@1
  displayName: "Publish artifacts"
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'release'
    publishLocation: 'Container'